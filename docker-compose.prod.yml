name: access-remedy-prod

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env.production}
      MAX_REQUEST_BODY_SIZE: ${MAX_REQUEST_BODY_SIZE:-60MB}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-admin}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: access-remedy-api:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      PORT: "8000"
      DATA_DIR: /app/data
      TRUST_PROXY_HEADERS: "true"
      RATE_LIMIT_ENABLED: "true"
    expose:
      - "8000"
    volumes:
      - ./data-prod:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - edge

networks:
  edge:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
