[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "access-remedy"
version = "0.1.0"
description = "Open-source DocAccess-style PDF accessibility overlay powered by Gemini"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Johnny Phung", email = "johnnythegeek@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",
    "google-genai>=0.5",
    "pypdf[crypto,image]>=5.0",
    "pillow>=10.4",
    "livekit-api>=0.8",
    "beautifulsoup4>=4.12",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "esprima>=4.0.1",
    "llama-cloud>=2.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "playwright>=1.49",
    "ruff>=0.6",
    "httpx>=0.27",
    "reportlab>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
