name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run pytest (unit + static a11y)
        run: pytest -q

      - name: Install Playwright
        run: playwright install --with-deps chromium

      - name: Build viewer
        working-directory: viewer
        run: |
          npm ci
          npm run build

      - name: Build embed
        working-directory: embed
        run: |
          npm ci
          npm run build

      - name: Stage built assets
        run: |
          mkdir -p static
          cp -R viewer/dist static/viewer
          cp -R embed/dist static/embed

      - name: Run axe-core WCAG 2.1 AA gate
        env:
          RUN_AXE: "1"
        run: pytest -q tests/test_a11y.py::test_axe_core_against_fixture

      - name: Build Docker image
        run: docker build -t access-remedy-api:ci .

      - name: Smoke test Docker image
        run: |
          docker run --rm -d --name access-remedy-ci -e PORT=8000 access-remedy-api:ci
          trap 'docker rm -f access-remedy-ci' EXIT
          for attempt in {1..30}; do
            if docker exec access-remedy-ci python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"; then
              exit 0
            fi
            sleep 1
          done
          docker logs access-remedy-ci
          exit 1

      - name: Validate production Compose file
        env:
          PUBLIC_HOST: access.example.com
          PUBLIC_ORIGIN: https://access.example.com
        run: docker compose -f docker-compose.prod.yml config --quiet
