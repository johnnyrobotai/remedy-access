name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run pytest (unit + static a11y)
        run: pytest -q

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Build viewer
        working-directory: viewer
        run: |
          npm ci || npm install
          npm run build

      - name: Build embed
        working-directory: embed
        run: |
          npm ci || npm install
          npm run build

      - name: Stage built assets
        run: |
          mkdir -p static
          cp -R viewer/dist static/viewer
          cp -R embed/dist static/embed

      - name: Run axe-core WCAG 2.1 AA gate
        env:
          RUN_AXE: "1"
        run: pytest -q tests/test_a11y.py::test_axe_core_against_fixture
